name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytorch
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --no-install-project
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytorch
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q

  python-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytorch
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: pytorch/dist/

  mlx:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mlx
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - run: cargo fmt --check
      - run: cargo test --lib --tests

  rust-build:
    runs-on: ubuntu-latest
    needs: rust-test
    defaults:
      run:
        working-directory: rust
    env:
      CUDA_OXIDE_LLC: /usr/bin/llc-21
      # Keep in sync with the cuda-core/cuda-device/cuda-host `rev` in Cargo.toml.
      CUDA_OXIDE_REV: 76a1d8840e5360207943805d036d8e299bda7728
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM 21 and Clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21 libclang-21-dev libclang-cpp21-dev libclang-common-21-dev
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100

      - name: Install CUDA Toolkit 12
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.5.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-03
          components: rust-src, rustc-dev, rust-analyzer, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: cuda-oxide-build

      - name: Install cargo-oxide
        run: cargo install --git https://github.com/NVlabs/cuda-oxide.git --rev "$CUDA_OXIDE_REV" cargo-oxide

      # cargo-oxide's own backend discovery falls back to a shallow clone of
      # cuda-oxide's `main` branch (unpinned) whenever no CUDA_OXIDE_BACKEND
      # override, project config, or fresh cache is present -- see
      # https://github.com/NVlabs/cuda-oxide/blob/main/crates/cargo-oxide/src/backend.rs.
      # The GitHub Actions cache for this job expires after 7 days of no
      # access, so any week without a rust-build run silently re-fetches
      # `main` HEAD and can pick up a breaking change upstream. Building the
      # backend ourselves from the same pinned rev as Cargo.lock and pointing
      # CUDA_OXIDE_BACKEND at it (highest-precedence override) makes the
      # build fully reproducible.
      - name: Build pinned codegen backend
        run: |
          set -euo pipefail
          rm -rf /tmp/cuda-oxide-pinned
          git init -q /tmp/cuda-oxide-pinned
          git -C /tmp/cuda-oxide-pinned remote add origin https://github.com/NVlabs/cuda-oxide.git
          git -C /tmp/cuda-oxide-pinned fetch --depth 1 origin "$CUDA_OXIDE_REV"
          git -C /tmp/cuda-oxide-pinned checkout -q FETCH_HEAD

          codegen_crate=/tmp/cuda-oxide-pinned/crates/rustc-codegen-cuda
          target_dir="$codegen_crate/target"
          sysroot_lib="$(rustc --print sysroot)/lib"
          host="$(rustc -vV | sed -n 's/^host: //p')"

          env \
            CARGO_TARGET_DIR="$target_dir" \
            CARGO_ENCODED_RUSTFLAGS="" \
            LIBRARY_PATH="$sysroot_lib${LIBRARY_PATH:+:$LIBRARY_PATH}" \
            LD_LIBRARY_PATH="$sysroot_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            -u RUSTFLAGS -u CARGO_BUILD_RUSTFLAGS -u CARGO_BUILD_TARGET \
            cargo build --manifest-path "$codegen_crate/Cargo.toml" --lib \
              --target host-tuple --target-dir "$target_dir"

          so_path="$target_dir/$host/debug/librustc_codegen_cuda.so"
          test -f "$so_path"
          echo "CUDA_OXIDE_BACKEND=$so_path" >> "$GITHUB_ENV"

      - name: Set up libcuda driver stub
        run: |
          sudo ln -sf "$CUDA_PATH/lib64/stubs/libcuda.so" "$CUDA_PATH/lib64/stubs/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$CUDA_PATH/lib64/stubs:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: cargo oxide build
        run: cargo oxide build --features gpu
